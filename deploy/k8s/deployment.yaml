apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanolink-api
  labels:
    app: nanolink-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nanolink-api
  template:
    metadata:
      labels:
        app: nanolink-api
    spec:
      containers:
      - name: nanolink
        image: ghcr.io/nanolink/nanolink:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
