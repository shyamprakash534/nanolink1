version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - DATABASE_URL=postgres://nanolink:nanolink_secret@postgres:5432/nanolink?sslmode=disable
      - REDIS_ADDR=redis:6379
      - CLICKHOUSE_DSN=clickhouse://clickhouse:9000/nanolink_analytics
      - RATE_LIMIT_CAPACITY=100
      - RATE_LIMIT_REFILL=10
    depends_on:
      - postgres
      - redis
      - clickhouse
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=nanolink
      - POSTGRES_PASSWORD=nanolink_secret
      - POSTGRES_DB=nanolink
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_postgres_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./migrations/002_clickhouse_schema.sql:/docker-entrypoint-initdb.d/002_schema.sql:ro
      - chdata:/var/lib/clickhouse
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    restart: always

volumes:
  pgdata:
  redisdata:
  chdata:
  grafanadata:
